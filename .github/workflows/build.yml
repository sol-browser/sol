# Builds Sol and runs its unit tests on every push to main and every pull
# request. A version tag (v1.2.3) also packs Sol with Velopack and attaches the
# setup and the update feed to a draft release. Installed copies see the update
# once a maintainer publishes the release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/browser-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The pinned engine archive (~176 MB), keyed by its lock.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: deps-${{ hashFiles('cmake/cef.lock.json', 'cmake/sqlite.lock.json', 'cmake/velopack.lock.json') }}

      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Release

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match VERSION $version" }

      - uses: actions/setup-dotnet@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          dotnet-version: 8.0.x

      # Stages and verifies the release files (build_installer.ps1), then packs
      # them with Velopack: setup, full and delta packages, releases.win.json.
      - name: Pack the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check Pillow
          ./scripts/build_installer.ps1 -BuildDirectory Release
          python scripts/verify_installer.py --build-directory Release
          ./scripts/pack_release.ps1

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: artifacts/velopack/publish/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Sol $version" --notes "Built by CI from $GITHUB_REF_NAME. Edit these notes before publishing." \
            Sol-Setup-*.exe Sol-*.sha256 SolBrowser-*.nupkg releases.win.json
